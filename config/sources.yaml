# Seeded sources — hand-curated, edited by a human.
#
# Feeds discovered automatically from the CNCF landscape live in
# config/discovered_feeds.json instead (regenerated by
# src/cncf_landscape.py). Keeping the two separate means this file only
# ever contains sources someone deliberately chose, and the generated
# file can be blown away and rebuilt without losing that curation.

# GitHub projects explicitly requested even though they are not (all)
# CNCF landscape entries. Release feed is derived as
# github.com/{repo}/releases.atom
explicit_github_repos:
  - hashicorp/terraform
  - grafana/grafana
  - grafana/loki
  - grafana/tempo
  - grafana/mimir
  - vectordotdev/vector
  - ansible/ansible

# GitLab-hosted projects to track explicitly. Release feed is derived as
# gitlab.com/{project}/-/releases.atom
# (The CNCF landscape currently yields zero gitlab.com repo_url entries —
# see src/cncf_landscape.py — so anything tracked from GitLab today has
# to be listed here or added by hand.)
explicit_gitlab_projects: []

# Cloud provider changelogs — the primary announcements everything else
# reblogs. All verified working RSS/Atom feeds as of 2026-08.
cloud_changelogs:
  - name: "AWS What's New"
    url: "https://aws.amazon.com/about-aws/whats-new/recent/feed/"
    tag: aws
  - name: "Azure Updates"
    # azure.microsoft.com/en-us/updates/feed/ now serves an HTML SPA shell,
    # not a feed. This is the actual feed the Azure updates page reads from.
    url: "https://www.microsoft.com/releasecommunications/api/v2/azure/rss"
    tag: azure
  - name: "Google Cloud Release Notes"
    url: "https://cloud.google.com/feeds/gcp-release-notes.xml"
    tag: gcp

# Hugging Face organizations to watch for model/dataset releases.
# HF does not publish per-org RSS, so src/huggingface_source.py polls
# the models/datasets list APIs filtered to these org authors instead.
huggingface_orgs:
  - huggingface
  - meta-llama
  - mistralai
  - google
  - microsoft
  - nvidia
  - deepset-ai
  - vllm-project

# GitHub Security Advisories (GHSA), via the GitHub Advisory Database API
# (api.github.com/advisories — there is no separate "feed" endpoint for
# this; it's the official free, structured, no-key-required source).
# Advisories are matched to tracked projects by comparing each advisory's
# source_code_location against the set of GitHub repos this agent watches
# (explicit + CNCF-landscape-discovered).
github_security_advisories:
  enabled: true
  lookback_hours: 72
  minimum_severity: "medium" # one of: low, medium, high, critical
